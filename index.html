<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SchoolSphere PRO - Hakito Engine</title>
    <meta name="description" content="Sistem Informasi Manajemen Sekolah Terintegrasi by Hakito Engine" />
    <meta property="og:title" content="SchoolSphere PRO - Hakito Engine" />
    <meta property="og:description" content="Sistem Informasi Manajemen Sekolah Terintegrasi" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="text/javascript">
      // Decode SPA redirect from 404.html if present on GitHub Pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans selection:bg-indigo-500 selection:text-white">
    <div id="root">
      <div id="app-preloader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 24px;">
        <div style="width: 56px; height: 56px; border: 4px solid rgba(99, 102, 241, 0.2); border-top-color: #6366f1; border-radius: 50%; animation: spin 0.9s linear infinite; margin-bottom: 20px;"></div>
        <h2 style="font-size: 1.25rem; font-weight: 700; margin: 0 0 8px 0; letter-spacing: -0.02em;">SchoolSphere PRO</h2>
        <p style="font-size: 0.85rem; color: #94a3b8; margin: 0 0 16px 0; max-width: 380px;">Memuat sistem informasi dan manajemen sekolah terintegrasi...</p>
        
        <div id="preloader-hint" style="display: none; max-width: 440px; background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(71, 85, 105, 0.5); border-radius: 12px; padding: 16px; margin-top: 12px; font-size: 0.75rem; text-align: left; line-height: 1.5; color: #cbd5e1;">
          <div style="font-weight: 700; color: #f59e0b; margin-bottom: 6px;">💡 Tips Deployment GitHub Pages:</div>
          <p style="margin: 0 0 6px 0;">Jika tampilan tidak berpindah: Pastikan proses build di GitHub Actions telah selesai dijalankan (centang hijau ✅ di tab <b>Actions</b>).</p>
          <button onclick="window.location.reload()" style="background: #4f46e5; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; margin-top: 6px;">Muat Ulang Halaman</button>
        </div>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
      <script>
        setTimeout(function() {
          var hint = document.getElementById('preloader-hint');
          if (hint) hint.style.display = 'block';
        }, 5000);
      </script>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
